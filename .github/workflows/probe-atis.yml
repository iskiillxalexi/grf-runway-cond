name: probe packages
on:
  push:
    branches: [probe-atis]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: fetch
        run: |
          mkdir -p out && cd out
          npm pack world-atlas@2.0.2 topojson-client@3.1.0 2>&1 | tail -3
          curl -sS -m 60 -o VATSpy.dat https://raw.githubusercontent.com/vatsimnetwork/vatspy-data-project/master/VATSpy.dat || true
          ls -la
      - name: publish
        run: |
          cd out && git init -q -b probe && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m probe && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" probe
