# The forecast for the Weather view of the Route tool: NOAA's GFS model (U.S. National Weather Service, public domain),
# cut down to small files and published on the "wx" branch. The app reads it from raw.githubusercontent.com
# (no server, no keys).
# A new run of the model is ready four times a day. This job looks whether there is a new run, and reads and
# publishes only then: a start with nothing new costs a few seconds.
# It is set to start every hour, but GitHub starts scheduled jobs on this repository only every few hours. So it
# also starts on the comment the apps write on the issue "GRF data refresh" when their SIGMETs are old (see
# snowtam.yml; only comments by the repository owner count): while the app is in use somewhere, a new run of the
# model is published within minutes of being ready.
name: Weather forecast
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
  issue_comment:
    types: [created]
permissions:
  contents: write
jobs:
  wx:
    if: github.event_name != 'issue_comment' || (github.event.issue.title == 'GRF data refresh' && github.event.comment.user.login == github.repository_owner)
    concurrency:
      group: wx
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATA_BRANCH: wx
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          fetch-depth: 1
      - name: Is there a new run of the model?
        id: check
        shell: bash
        run: |
          curl -fsS --max-time 20 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${DATA_BRANCH}/index.json" -o have.json || rm -f have.json
          python3 .github/scripts/wx.py out --hours 48 $([ -f have.json ] && echo "--have have.json") --check | tee check.txt
          echo "state=$(tail -n 1 check.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.check.outputs.state == 'new'
        with:
          python-version: '3.12'
      - name: Read the forecast
        if: steps.check.outputs.state == 'new'
        run: |
          python3 -m pip install --quiet numpy pygrib
          rm -rf out
          python3 .github/scripts/wx.py out --hours 48
      - name: Publish on the wx branch
        if: steps.check.outputs.state == 'new'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f out/index.json ] || { echo "::error::The forecast was not written"; exit 1; }
          bash .github/scripts/publish.sh out "Weather forecast"
